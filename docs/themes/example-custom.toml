# An example of your own theme: save a file like this as
#   ~/.config/shipyard/themes/<anything>.toml
# then put  theme = "Tide"  in config.toml, or pick Tide in the gear menu's
# Theme submenu. A save applies at once.
#
# Start from a built-in theme with `extends`, then change only what you want.
# Every token you leave out comes from the theme you extend, and so does its
# appearance: a theme that extends Shipyard Light is light too.
name = "Tide"
version = 1
extends = "Shipyard Light"
description = "Shipyard Light with a deep green accent on a grey-green panel."

# Raw colors, named once. A token's value is one of these names,
# a hex color (#rrggbb or #rrggbbaa), or "system" for the macOS color.
[palette]
green = "#2E7357"
mist = "#F6F9F6"

# A table without a prefix, such as [accent], sets the theme's appearance.
# A theme of both appearances, such as one that extends System, can change
# one of them alone with [light.*] or [dark.*].
[accent]
accent = "green"

[surface]
panel = "mist"

# The attention dot: attention for a new or changed row, attention-failed
# while a pull request's checks fail. Left out, attention-failed is the
# failed phase's colour; keep the two far apart, or `shipyard config check`
# warns that the dot may look the same.
[signal]
attention = "green"

# The colours of states: pull requests, issues, runs, checks, reviews,
# the rate limit, pings and notes. [phase] names one colour for each
# phase of a state's life: active, done, failed and quiet.
# A [states.<kind>] table gives one state its own colour: a phase name,
# a palette name, a hex color or "system". Every state you leave out
# takes its phase; the rate limit's low, a warning and not a phase, is
# the macOS orange. Here every failed state is a deeper red, a draft pull
# request and a ping are green, and passed checks are teal, not done's purple.
[phase]
failed = "#B3392F"

[states.pull-request]
draft = "green"

[states.check]
passed = "#0E7C86"

[states.ping]
open = "green"

# Knobs shared by both appearances.
[density]
preset = "compact"   # compact, regular or comfortable; or row, header, bar, gutter in points

[shape]
small = 6
medium = 10
large = 14           # accepted and checked, with no effect

[material]
style = "flat"       # flat paints surfaces with their colors; glass uses the system's material
