# An example of your own theme: save a file like this as
#   ~/.config/shipyard/themes/<anything>.toml
# then put  theme = "Sunset"  in config.toml. A save applies at once.
#
# Start from a built-in theme with `extends`, then change only what you want.
# Every token you leave out comes from the theme you extend.
name = "Sunset"
version = 1
extends = "Shipyard"
description = "Shipyard with a coral accent and warmer text on dark."

# Raw colors, named once. A token's value is one of these names,
# a hex color (#rrggbb or #rrggbbaa), or "system" for the macOS color.
[light.palette]
coral = "#C2410C"
[dark.palette]
coral = "#FB923C"

# A table without a prefix, such as [accent], sets light and dark;
# [light.*] and [dark.*] change a color for one appearance.
[accent]
accent = "coral"

[signal]
attention = "coral"

# Make the unread dot and the count badge text readable on the coral fill.
[light.text]
on-accent = "#ffffff"
[dark.text]
on-accent = "#1a0b02"

# The colours of pull requests, issues and runs. [phase] names one colour
# for each phase of an item's life: active, done, failed and quiet.
# A [states.<kind>] table gives one state its own colour: a phase name,
# a palette name, a hex color or "system". Every state you leave out
# takes its phase. Here every failed state is a deeper red, and a draft
# pull request is coral.
[light.phase]
failed = "#B91C1C"
[dark.phase]
failed = "#F87171"

[states.pull-request]
draft = "coral"

# Knobs shared by both appearances.
[density]
preset = "compact"   # compact, regular or comfortable; or row, header, bar, gutter in points

[shape]
small = 6
medium = 10
large = 14           # accepted and checked, with no effect

[material]
style = "flat"       # flat paints surfaces with their colors; glass uses the system's material
