name: ci

on:
  push:
  pull_request:

jobs:
  core-linux:
    name: core tests (ubuntu, swift 6)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: build ShipyardCore
        run: swift build --target ShipyardCore
      - name: test
        run: swift test

  macos:
    name: build and test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: build everything
        run: swift build
      - name: bundle the app
        run: make bundle
      - name: test
        run: make test
