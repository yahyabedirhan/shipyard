name: Feature request
description: Propose a change or a new capability.
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you want to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The change you have in mind
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
